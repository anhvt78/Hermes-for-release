        - "root_cause_unknown"
        - "exceeds_authority"
        - "affects_other_layers"
        - "project_stop_risk"
        - "no_approved_process"
        - "sla_exceeded"
      channel: "board_kiem_soat"
      task_prefix: "[SU CO]"
