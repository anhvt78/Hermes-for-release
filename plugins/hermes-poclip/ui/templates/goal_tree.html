<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Tree (D2) — hermes-poclip</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .gt-toolbar { display:flex; align-items:center; gap:1rem; padding:0.75rem 2rem; background:#f8fafc; border-bottom:1px solid #e2e8f0; }
    .gt-toolbar h2 { font-size:1rem; font-weight:700; color:#0f172a; margin:0; }
    .gt-tree-wrap { padding:1.5rem 2rem; }
    .gt-node { margin:0.5rem 0; }
    .gt-node-header { display:flex; align-items:center; gap:0.5rem; cursor:pointer; padding:0.5rem 0.75rem; border-radius:8px; background:#fff; border:1px solid #e2e8f0; transition:box-shadow .15s; }
    .gt-node-header:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .gt-level-company  { border-left:4px solid #0f3460; }
    .gt-level-initiative{ border-left:4px solid #4f46e5; }
    .gt-level-outcome  { border-left:4px solid #0891b2; }
    .gt-level-task     { border-left:4px solid #16a34a; }
    .gt-title { font-weight:600; color:#0f172a; font-size:0.875rem; flex:1; }
    .gt-owner { font-size:0.75rem; color:#64748b; }
    .gt-progress-bar { width:80px; height:8px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
    .gt-progress-fill { height:100%; background:#4f46e5; transition:width .3s; }
    .gt-progress-fill.done { background:#16a34a; }
    .gt-pct { font-size:0.75rem; color:#475569; min-width:36px; text-align:right; }
    .gt-budget { font-size:0.72rem; color:#94a3b8; }
    .gt-children { margin-left:1.5rem; border-left:2px dashed #e2e8f0; padding-left:0.75rem; }
    .badge-status { padding:0.1rem 0.45rem; border-radius:999px; font-size:0.7rem; font-weight:600; }
    .badge-planned   { background:#f1f5f9; color:#475569; }
    .badge-active    { background:#dbeafe; color:#1d4ed8; }
    .badge-achieved  { background:#dcfce7; color:#166534; }
    .badge-cancelled { background:#fee2e2; color:#991b1b; }
    .gt-orphan-section { padding:1rem 2rem; }
    .gt-orphan-section h3 { font-size:0.95rem; font-weight:700; color:#92400e; margin-bottom:0.75rem; }
    .gt-orphan-warn-yellow { background:#fff7ed; border:1px solid #fdba74; border-radius:8px; padding:0.75rem 1rem; }
    .gt-orphan-warn-red { background:#fef2f2; border:1px solid #fca5a5; border-radius:8px; padding:0.75rem 1rem; }
    .gt-orphan-item { font-size:0.85rem; padding:0.25rem 0; color:#0f172a; display:flex; align-items:center; gap:0.5rem; }
    .gt-orphan-item .task-id { font-family:monospace; color:#64748b; font-size:0.78rem; }
    .gt-orphan-badge { font-size:0.7rem; padding:0.1rem 0.4rem; border-radius:999px; font-weight:600; }
    .badge-in-progress    { background:#fef9c3; color:#92400e; }
    .badge-pending-review { background:#ede9fe; color:#5b21b6; }
    .badge-draft    { background:#f1f5f9; color:#475569; }
    .badge-assigned { background:#dbeafe; color:#1d4ed8; }
    /* Modal */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:#fff; border-radius:12px; padding:1.5rem; max-width:540px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,.15); max-height:80vh; overflow-y:auto; }
    .modal-box h3 { font-size:1rem; font-weight:700; color:#0f172a; margin-bottom:1rem; }
    .modal-field { display:flex; gap:0.5rem; margin-bottom:0.5rem; font-size:0.85rem; }
    .modal-label { color:#64748b; min-width:120px; font-weight:600; }
    .modal-value { color:#0f172a; word-break:break-all; }
    .modal-close { float:right; background:none; border:none; cursor:pointer; font-size:1.2rem; color:#94a3b8; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #e2e8f0; border-top-color:#4f46e5; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .gt-empty { color:#94a3b8; font-size:0.9rem; padding:1.5rem 0; }
  </style>
</head>
<body>

<header>
  <span>hermes-poclip</span>
  <h1>Goal Tree — D2 (TD-01)</h1>
  <a href="/policy-config" style="color:#a5b4fc;font-size:0.85rem;text-decoration:none;">→ Policy Config</a>
</header>

<div class="gt-toolbar">
  <h2>Cây Mục Tiêu</h2>
  <button class="btn btn-approve" onclick="loadTree()" id="btn-refresh">↻ Refresh</button>
  <span id="gt-status" style="font-size:0.82rem;color:#64748b;"></span>
</div>

<div class="gt-tree-wrap" id="gt-tree-wrap">
  <div class="gt-empty">Đang tải...</div>
</div>

<div class="gt-orphan-section" id="gt-orphan-section" style="display:none;">
  <h3 id="gt-orphan-heading">⚠ Tasks Mồ Côi</h3>
  <div id="gt-orphan-list"></div>
</div>

<!-- Modal task contract -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-box" id="modal-box">
    <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    <h3 id="modal-title">Task Contract</h3>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/static/js/goals.js"></script>
<script>
  loadTree();
</script>
</body>
</html>
